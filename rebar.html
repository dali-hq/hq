<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鋼筋標籤產生器</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; padding: 40px; background-color: #f0f2f5; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); width: 480px; }
        h2 { text-align: center; color: #1a73e8; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .input-group { margin-bottom: 15px; display: flex; align-items: center; }
        label { width: 110px; font-weight: bold; color: #444; font-size: 16px; }
        input, select { flex: 1; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; transition: border-color 0.3s; }
        input:focus, select:focus { border-color: #1a73e8; background-color: #f8fbff; }
        .result-area { background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px dashed #ccc; font-family: monospace; font-size: 18px; color: #d93025; font-weight: bold; margin-top: 15px; text-align: center; word-break: break-all; min-height: 30px; }
        button { width: 100%; padding: 15px; background-color: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        button:hover { background-color: #1557b0; }
        button:active { transform: translateY(1px); }
        .hint { font-size: 12px; color: #888; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>鋼筋標籤產生器</h2>
    
    <div class="input-group">
        <label>日期 (mm/dd)</label>
        <input type="text" id="dateInput" placeholder="例: 0803" oninput="updateText()" onfocus="this.select()">
    </div>
    
    <div class="input-group">
        <label>批號</label>
        <input type="text" id="batchInput" placeholder="例: S260803034" oninput="updateText()" onfocus="this.select()">
    </div>
    
    <div class="input-group">
        <label>號數</label>
        <select id="sizeInput" onchange="updateText()">
            <option value="3">3號</option>
            <option value="4">4號</option>
            <option value="5">5號</option>
            <option value="6" selected>6號</option>
            <option value="7">7號</option>
            <option value="8">8號</option>
            <option value="9">9號</option>
            <option value="10">10號</option>
            <option value="11">11號</option>
        </select>
    </div>
    
    <div class="input-group">
        <label>規格</label>
        <select id="specInput" onchange="updateText()">
            <option value="SD280">SD280</option>
            <option value="SD280W">SD280W</option>
            <option value="SD420W" selected>SD420W</option>
        </select>
    </div>
    
    <div class="input-group">
        <label>重量 (T)</label>
        <input type="number" id="weightInput" step="0.01" value="0.00" oninput="updateText()" onfocus="this.select()">
    </div>

    <div class="result-area" id="finalText"></div>
    
    <button onclick="copyToClipboard()">複製文字</button>
    <div class="hint">PC操作提示：按 Tab 鍵快速切換輸入框</div>
</div>

<script>
    // 自動帶入今天的 mm/dd
    function initDate() {
        const now = new Date();
        const m = (now.getMonth() + 1).toString().padStart(2, '0');
        const d = now.getDate().toString().padStart(2, '0');
        document.getElementById('dateInput').value = m + d;
    }

    function updateText() {
        const rawDate = document.getElementById('dateInput').value.trim();
        const batch = document.getElementById('batchInput').value.trim();
        const size = document.getElementById('sizeInput').value;
        const spec = document.getElementById('specInput').value;
        const weight = document.getElementById('weightInput').value;

        // 處理日期：民國年 (假設當前為 115 年，或抓取系統年份扣除 1911)
        const currentYearRoc = new Date().getFullYear() - 1911; 
        
        let formattedDate = `${currentYearRoc}.MM.DD`;
        if (rawDate.length >= 4) {
            const mm = rawDate.substring(0, 2);
            const dd = rawDate.substring(2, 4);
            formattedDate = `${currentYearRoc}.${mm}.${dd}`;
        }

        // 處理規格括號內的數字（例如 SD280 抓 280，SD420W 抓 420）
        let specCode = "";
        if (spec.includes("280")) {
            specCode = "280";
        } else if (spec.includes("420")) {
            specCode = "420W"; // 或依照你範例中的 (420W)
        }

        // 組合最終格式: 日期-批號-號數#(規格)-重量T
        const result = `${formattedDate}-${batch}-${size}#(${specCode})-${weight}T`;
        
        document.getElementById('finalText').innerText = result;
    }

    function copyToClipboard() {
        const text = document.getElementById('finalText').innerText;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = '✅ 已複製！';
            btn.style.backgroundColor = '#34a853';
                        
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.backgroundColor = '#1a73e8';
            }, 1500);
        });
    }

    // 初始化
    initDate();
    updateText();
</script>

</body>
</html>
