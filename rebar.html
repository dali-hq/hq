<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鋼筋標籤產生器-PC單行版</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; padding: 40px; background-color: #f0f2f5; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); width: 850px; }
        h2 { text-align: center; color: #1a73e8; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        /* PC 單行排版 */
        .batch-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; background: #fafafa; padding: 10px; border-radius: 8px; border: 1px solid #ddd; }
        .batch-row input, .batch-row select { padding: 8px; border: 2px solid #ddd; border-radius: 6px; font-size: 15px; outline: none; }
        .batch-row input:focus, .batch-row select:focus { border-color: #1a73e8; background-color: #f8fbff; }
        
        .inp-date { width: 90px; }
        .inp-batch { width: 170px; }
        .inp-size { width: 75px; text-align: center; }
        .inp-spec { width: 110px; }
        .inp-weight { width: 85px; }

        .btn-delete { background-color: #d93025; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn-delete:hover { background-color: #b31412; }

        .result-area { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px dashed #ccc; font-family: monospace; font-size: 16px; color: #d93025; font-weight: bold; margin-top: 15px; white-space: pre-wrap; min-height: 60px; }
        
        .btn-primary { width: 100%; padding: 12px; background-color: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 5px; font-weight: bold; }
        .btn-primary:hover { background-color: #1557b0; }
        .btn-success { width: 100%; padding: 15px; background-color: #34a853; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        .btn-success:hover { background-color: #2b813f; }
        
        /* 放大並改為藍色的鋼筋對照表 */
        .hint-box { margin-top: 20px; padding: 15px; background-color: #e8f0fe; border-radius: 8px; border-left: 5px solid #1a73e8; }
        .hint-title { font-weight: bold; color: #1a73e8; font-size: 16px; margin-bottom: 5px; }
        .hint-content { font-size: 18px; color: #1a73e8; font-weight: bold; line-height: 1.5; font-family: monospace; }
    </style>
</head>
<body>

<div class="card">
    <h2>鋼筋標籤產生器 (PC單行版)</h2>
    
    <div id="itemsList">
        <!-- 動態單行輸入區 -->
    </div>

    <button class="btn-primary" onclick="addItem()">＋ 新增一筆鋼筋</button>

    <div class="result-area" id="finalText"></div>
    
    <button class="btn-success" onclick="copyToClipboard()">複製全部文字</button>

    <div class="hint-box">
        <div class="hint-title">💡 鋼筋號數對照參考：</div>
        <div class="hint-content">3(#3) / 4(#4) / 5(#5) / 6(#6) / 7(#7)<br>8(#8) / 9(#9) / 10(#10) / 11(#11)</div>
    </div>
</div>

<script>
    // 取得預設今天的 mm/dd
    function getDefaultDate() {
        const now = new Date();
        const m = (now.getMonth() + 1).toString().padStart(2, '0');
        const d = now.getDate().toString().padStart(2, '0');
        return m + d;
    }

    // 初始化載入第一筆
    function init() {
        addItem(getDefaultDate(), '', '6', 'SD420W', '0.00');
    }

    // 新增一筆單行輸入
    function addItem(date = getDefaultDate(), batch = '', size = '6', spec = 'SD420W', weight = '0.00') {
        const container = document.getElementById('itemsList');
        const index = container.children.length;

        const div = document.createElement('div');
        div.className = 'batch-row';
        div.innerHTML = `
            <input type="text" class="inp-date" value="${date}" placeholder="日期mm/dd" title="日期 (mm/dd)" oninput="updateText()">
            <input type="text" class="inp-batch" value="${batch}" placeholder="輸入批號" title="批號" oninput="updateText()">
            <input type="number" class="inp-size" value="${size}" min="3" max="11" placeholder="號數" title="號數 (3~11)" oninput="updateText()">
            <select class="inp-spec" title="規格" onchange="updateText()">
                <option value="SD280" ${spec==='SD280'?'selected':''}>SD280</option>
                <option value="SD280W" ${spec==='SD280W'?'selected':''}>SD280W</option>
                <option value="SD420W" ${spec==='SD420W'?'selected':''}>SD420W</option>
            </select>
            <input type="number" class="inp-weight" value="${weight}" step="0.01" placeholder="重量" title="重量 (T)" oninput="updateText()">
            ${index > 0 ? '<button class="btn-delete" onclick="removeItem(this)" title="刪除此行">✕</button>' : '<div style="width: 35px;"></div>'}
        `;
        container.appendChild(div);
        updateText();
    }

    // 刪除該行
    function removeItem(btn) {
        btn.closest('.batch-row').remove();
        updateText();
    }

    // 組合全部行數的文字
    function updateText() {
        const items = document.querySelectorAll('.batch-row');
        let results = [];
        const currentYearRoc = new Date().getFullYear() - 1911; 

        items.forEach(item => {
            const rawDate = item.querySelector('.inp-date').value.trim();
            const batch = item.querySelector('.inp-batch').value.trim();
            const size = item.querySelector('.inp-size').value.trim();
            const spec = item.querySelector('.inp-spec').value;
            const weight = item.querySelector('.inp-weight').value;

            // 處理日期格式
            let formattedDate = `${currentYearRoc}.MM.DD`;
            if (rawDate.length >= 4) {
                const mm = rawDate.substring(0, 2);
                const dd = rawDate.substring(2, 4);
                formattedDate = `${currentYearRoc}.${mm}.${dd}`;
            }

            // 抓取規格內的數字
            let specCode = spec.includes("280") ? "280" : "420W";
            if(spec.includes("W") && specCode === "280") specCode = "280W";

            const resultLine = `${formattedDate}-${batch}-${size}#(${specCode})-${weight}T`;
            results.push(resultLine);
        });

        document.getElementById('finalText').innerText = results.join('\n');
    }

    function copyToClipboard() {
        const text = document.getElementById('finalText').innerText;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.querySelector('.btn-success');
            const originalText = btn.innerText;
            btn.innerText = '✅ 全部已複製！';
            btn.style.backgroundColor = '#2b813f';
                        
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.backgroundColor = '#34a853';
            }, 1500);
        });
    }

    // 初始化載入
    init();
</script>

</body>
</html>
