<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鋼筋標籤產生器-多行版</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; padding: 40px; background-color: #f0f2f5; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); width: 550px; }
        h2 { text-align: center; color: #1a73e8; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .row { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-group { flex: 1; display: flex; flex-direction: column; }
        label { font-weight: bold; color: #444; font-size: 14px; margin-bottom: 5px; }
        input, select { padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; transition: border-color 0.3s; }
        input:focus, select:focus { border-color: #1a73e8; background-color: #f8fbff; }
        
        .batch-container { background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 15px; position: relative; }
        .batch-container + .batch-container { margin-top: 15px; }
        .btn-delete { background-color: #d93025; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; position: absolute; top: 10px; right: 10px; }
        .btn-delete:hover { background-color: #b31412; }

        .result-area { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px dashed #ccc; font-family: monospace; font-size: 16px; color: #d93025; font-weight: bold; margin-top: 15px; white-space: pre-wrap; min-height: 50px; }
        
        .btn-primary { width: 100%; padding: 12px; background-color: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .btn-primary:hover { background-color: #1557b0; }
        .btn-success { width: 100%; padding: 15px; background-color: #34a853; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        .btn-success:hover { background-color: #2b813f; }
        
        .hint { font-size: 12px; color: #888; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>鋼筋標籤產生器 (多行版)</h2>
    
    <div id="itemsList">
        <!-- 動態生成的輸入列會放在這裡 -->
    </div>

    <button class="btn-primary" onclick="addItem()">＋ 新增一筆鋼筋</button>

    <div class="result-area" id="finalText"></div>
    
    <button class="btn-success" onclick="copyToClipboard()">複製全部文字</button>
    <div class="hint">鋼筋號數代照對應：3(#3/D10)、4(#4/D13)、5(#5/D16)、6(#6/D19)、7(#7/D22)、8(#8/D25)、9(#9/D29)、10(#10/D32)、11(#11/D36)</div>
</div>

<script>
    // 鋼筋對照表 (號數 -> 代號)
    const dMap = {
        '3': 'D10', '4': 'D13', '5': 'D16', '6': 'D19', '7': 'D22',
        '8': 'D25', '9': 'D29', '10': 'D32', '11': 'D36'
    };

    // 取得預設今天的 mm/dd
    function getDefaultDate() {
        const now = new Date();
        const m = (now.getMonth() + 1).toString().padStart(2, '0');
        const d = now.getDate().toString().padStart(2, '0');
        return m + d;
    }

    // 初始化加入第一筆
    function init() {
        addItem(getDefaultDate(), '', '6', 'SD420W', '0.00');
    }

    // 新增一筆輸入列
    function addItem(date = getDefaultDate(), batch = '', size = '6', spec = 'SD420W', weight = '0.00') {
        const container = document.getElementById('itemsList');
        const index = container.children.length;

        const div = document.createElement('div');
        div.className = 'batch-container';
        div.innerHTML = `
            ${index > 0 ? '<button class="btn-delete" onclick="removeItem(this)">刪除</button>' : ''}
            <div class="row">
                <div class="input-group">
                    <label>日期 (mm/dd)</label>
                    <input type="text" class="inp-date" value="${date}" placeholder="0803" oninput="updateText()">
                </div>
                <div class="input-group">
                    <label>批號</label>
                    <input type="text" class="inp-batch" value="${batch}" placeholder="S260803034" oninput="updateText()">
                </div>
            </div>
            <div class="row">
                <div class="input-group">
                    <label>號數 (3~11)</label>
                    <input type="number" class="inp-size" value="${size}" min="3" max="11" oninput="updateText()">
                </div>
                <div class="input-group">
                    <label>規格</label>
                    <select class="inp-spec" onchange="updateText()">
                        <option value="SD280" ${spec==='SD280'?'selected':''}>SD280</option>
                        <option value="SD280W" ${spec==='SD280W'?'selected':''}>SD280W</option>
                        <option value="SD420W" ${spec==='SD420W'?'selected':''}>SD420W</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>重量 (T)</label>
                    <input type="number" class="inp-weight" value="${weight}" step="0.01" oninput="updateText()">
                </div>
            </div>
        `;
        container.appendChild(div);
        updateText();
    }

    // 刪除該筆
    function removeItem(btn) {
        btn.closest('.batch-container').remove();
        updateText();
    }

    // 組合全部行數的文字
    function updateText() {
        const items = document.querySelectorAll('.batch-container');
        let results = [];
        const currentYearRoc = new Date().getFullYear() - 1911; 

        items.forEach(item => {
            const rawDate = item.querySelector('.inp-date').value.trim();
            const batch = item.querySelector('.inp-batch').value.trim();
            const size = item.querySelector('.inp-size').value.trim();
            const spec = item.querySelector('.inp-spec').value;
            const weight = item.querySelector('.inp-weight').value;

            // 處理日期格式
            let formattedDate = `${currentYearRoc}.MM.DD`;
            if (rawDate.length >= 4) {
                const mm = rawDate.substring(0, 2);
                const dd = rawDate.substring(2, 4);
                formattedDate = `${currentYearRoc}.${mm}.${dd}`;
            }

            // 抓取規格內的數字（例如 SD280 取 280，SD420W 取 420W）
            let specCode = spec.includes("280") ? "280" : "420W";
            if(spec.includes("W") && specCode === "280") specCode = "280W"; // 如果需要保留W可微調

            // 轉換號數格式：例如輸入 6，對應 D19 變成 D196# 或是照你原格式 6#(420W)
            // 依照你原本的範例：3#(280) 或 6#(420W)，這裡把號數直接帶入
            const resultLine = `${formattedDate}-${batch}-${size}#(${specCode})-${weight}T`;
            results.push(resultLine);
        });

        document.getElementById('finalText').innerText = results.join('\n');
    }

    function copyToClipboard() {
        const text = document.getElementById('finalText').innerText;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.querySelector('.btn-success');
            const originalText = btn.innerText;
            btn.innerText = '✅ 全部已複製！';
            btn.style.backgroundColor = '#2b813f';
                        
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.backgroundColor = '#34a853';
            }, 1500);
        });
    }

    // 初始化載入
    init();
</script>

</body>
</html>
